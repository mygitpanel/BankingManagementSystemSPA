@if (isLoading()) {

<div class="page-loader">

  <div class="loader-content">

    <div class="spinner"></div>

    <p>Creating Account...</p>

  </div>

</div>

}
@if (showSuccessPopup()) {

<div class="popup-overlay">

  <div class="popup-card">

    <h2>Account Created Successfully</h2>

    <p>
      Account Number:
      <strong>{{createdAccountNumber()}}</strong>
    </p>

    <button (click)="closePopup()">OK</button>

  </div>

</div>

}

<div class="account-page">

<h2>Create New Bank Account</h2>

<!-- PERSONAL DETAILS -->
<form #accountForm="ngForm">
<div class="form-card">

<h3>Personal Information</h3>

<div class="form-grid">

<div class="form-group">
<label>Full Name</label>
<input [(ngModel)]="fullName" name="fullName">
</div>

<div class="form-group">
<label>Email</label>
<input [(ngModel)]="email" name="email">
</div>

<div class="form-group">
<label>Password</label>
<input type="password" [(ngModel)]="password" name="password">
</div>

<div class="form-group">
<label>Phone Number</label>
<input [(ngModel)]="phoneNumber" name="phoneNumber">
</div>

<div class="form-group">
<label>Date Of Birth</label>
<input type="date" [(ngModel)]="dateOfBirth" name="dateOfBirth">
</div>

<div class="form-group">
<label>Gender</label>
<select [(ngModel)]="gender" name="gender">
<option>Male</option>
<option>Female</option>
<option>Other</option>
</select>
</div>

<div class="form-group">
<label>Nationality</label>
<input [(ngModel)]="nationality" name="nationality">
</div>

<div class="form-group">
<label>Marital Status</label>
<select [(ngModel)]="maritalStatus" name="maritalStatus">
<option>Single</option>
<option>Married</option>
</select>
</div>

<div class="form-group">
<label>Religion</label>
<input [(ngModel)]="religion" name="religion">
</div>

</div>

</div>

<!-- KYC DETAILS -->

<div class="form-card">

<h3>KYC Details</h3>

<div class="form-grid">

<div class="form-group">
<label>Aadhaar Number</label>
<input [(ngModel)]="aadhaarNumber" name="aadhaarNumber">
</div>

<div class="form-group">
<label>PAN Number</label>
<input [(ngModel)]="panNumber" name="panNumber">
</div>

</div>

</div>

<!-- ADDRESS DETAILS -->

<div class="form-card">

<h3>Address Details</h3>

<div class="form-grid">

<div class="form-group">
<label>Permanent Address</label>
<input [(ngModel)]="permanentAddress" name="permanentAddress">
</div>

<div class="form-group">
<label>Current Address</label>
<input [(ngModel)]="currentAddress" name="currentAddress">
</div>

<div class="form-group">
<label>City</label>
<input [(ngModel)]="city" name="city">
</div>

<div class="form-group">
<label>State</label>
<input [(ngModel)]="state" name="state">
</div>

<div class="form-group">
<label>Pincode</label>
<input [(ngModel)]="pincode" name="pincode">
</div>

</div>

</div>

<!-- NOMINEE DETAILS -->

<div class="form-card">

<h3>Nominee Details</h3>

<div class="form-grid">

<div class="form-group">
<label>Nominee Name</label>
<input [(ngModel)]="nomineeName" name="nomineeName">
</div>

<div class="form-group">
<label>Nominee Relation</label>
<input [(ngModel)]="nomineeRelation" name="nomineeRelation">
</div>

<div class="form-group">
<label>Nominee DOB</label>
<input type="date" [(ngModel)]="nomineeDOB" name="nomineeDOB">
</div>

<div class="form-group">
<label>Nominee Phone</label>
<input [(ngModel)]="nomineePhone" name="nomineePhone">
</div>

</div>

</div>

<!-- ACCOUNT SETTINGS -->

<div class="form-card">

<h3>Account Settings</h3>

<div class="form-grid">

<div class="form-group">
<label>Opening Balance</label>
<input type="number" [(ngModel)]="balance" placeholder="Enter opening balance" name="balance">
</div>

<div class="form-group">
<label>Account Type</label>
<select [(ngModel)]="accountType" name="accountType">
<option>Savings</option>
<option>Current</option>
</select>
</div>

<div class="form-group">
<label>Account Status</label>
<select [(ngModel)]="isActive" name="isActive">
<option [value]="true">Active</option>
<option [value]="false">Inactive</option>
</select>
</div>

</div>

</div>

<div class="submit-section">

<button class="create-btn" (click)="createUser(accountForm)" [disabled]="accountForm.invalid">
Create Account
</button>

</div>
</form>
</div>
